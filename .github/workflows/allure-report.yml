name: API Tests with Allure Report

on:
  push:
    branches: ["main", "TestAPI"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Clone application repository
        run: |
          git clone https://github.com/bondarenkokate73/simbirsoft_sdet_project.git app-repo
          cd app-repo
          ls -la

      - name: Fix docker-compose
        run: |
          cd app-repo
          sed -i 's/"up", "3"/"up"/' docker-compose.yaml
          sed -i '/links:/d' docker-compose.yaml
          sed -i '/ - postgres/d' docker-compose.yaml

      - name: Create .env file
        run: |
          cd app-repo
          echo "POSTGRES_USER=test" > .env
          echo "POSTGRES_PASSWORD=test" >> .env
          echo "POSTGRES_DB=test" >> .env
          echo "POSTGRES_HOST=postgres" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "HTTP_PORT=8080" >> .env
          echo "LOGGER_FORMAT=json" >> .env
          echo "=== .env file content ==="
          cat .env

      - name: Start services
        run: |
          cd app-repo
          docker-compose up -d
          sleep 30
          docker-compose ps

      - name: Check application status
        run: |
          cd app-repo
          echo "=== Application Logs ==="
          docker-compose logs service --tail=30
          echo "=== Testing Endpoints ==="
          curl -s http://localhost:8080 > /dev/null && echo "✅ Application is responding" || echo "❌ Application not responding"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run API tests
        run: |
          mvn clean test -Dbase.url=http://localhost:8080
        continue-on-error: true

      - name: Stop services
        if: always()
        run: |
          cd app-repo
          docker-compose down

      - name: Prepare Allure results
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d "target/allure-results" ]; then
            cp -r target/allure-results/* allure-results/
            echo "Test results copied"
          else
            echo "No test results found"
          fi

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 5